name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gem:
    uses: next-gen-gems/.github/.github/workflows/gem-ci.yml@main
    with:
      extra-rubies: '["jruby-head", "truffleruby-head"]'
      gemfiles: '["Gemfile", "gemfiles/rails_8_0.gemfile"]'
