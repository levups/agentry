name: CI

# The blocks shared by the Level UP Solutions gems are kept identical across the family.

on:
  push:
    branches: [main]
  # A draft runs nothing: marking it ready for review starts the CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: RuboCop
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Lint with RuboCop
        run: bundle exec rubocop --format github

  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.rails && format(' · Rails {0}', matrix.rails.version) || '' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every Ruby the core team still maintains (https://endoflife.date/ruby); the -head ones are in head.
        ruby: ["3.3", "3.4", "4.0"]
        rails: [{version: "8.1", gemfile: Gemfile}, {version: "8.0", gemfile: gemfiles/rails_8_0.gemfile}]
    env:
      BUNDLE_GEMFILE: ${{ matrix.rails.gemfile != 'Gemfile' && matrix.rails.gemfile || '' }}
    steps: &test-steps
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the tests
        run: bundle exec rake test

  # Allowed to fail, and truffleruby-head takes twice as long as the others: CI passed doesn't wait for them.
  head:
    name: Ruby ${{ matrix.ruby }}${{ matrix.rails && format(' · Rails {0}', matrix.rails.version) || '' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # ruby-head, then this gem's extra ones.
        ruby: [ruby-head, jruby-head, truffleruby-head]
        rails: [{version: "8.1", gemfile: Gemfile}, {version: "8.0", gemfile: gemfiles/rails_8_0.gemfile}]
    env:
      BUNDLE_GEMFILE: ${{ matrix.rails.gemfile != 'Gemfile' && matrix.rails.gemfile || '' }}
    steps: *test-steps

  docs:
    name: Highlighted docs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check the highlighted docs
        run: bundle exec rake docs:highlight:check
      # This gem's own: the site's numbers come from docs/benchmarks.json and docs/bot_coverage.json.
      - name: Check the rendered docs
        run: bundle exec rake docs:render:check

  # This gem's own: a change not meant to change an answer gives the same ones as fnando/browser at dd88933.
  corpus:
    name: Corpus diff
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check out fnando/browser at dd88933
        uses: actions/checkout@v7
        with:
          repository: fnando/browser
          ref: dd8893395248594ca0e4b6a3fbd221f36989b15b
          path: upstream
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Snapshot fnando/browser
        run: ruby -I upstream/lib script/corpus_snapshot.rb > "$RUNNER_TEMP/upstream.jsonl"
      - name: Snapshot Agentry
        run: ruby -I lib script/corpus_snapshot.rb > "$RUNNER_TEMP/agentry.jsonl"
      - name: Compare the answers
        run: ruby script/corpus_diff.rb "$RUNNER_TEMP/upstream.jsonl" "$RUNNER_TEMP/agentry.jsonl"

  # The one check main's ruleset requires, so the Rubies, Rails and jobs above can change without touching it.
  # Every other job belongs in needs: bin/x-gems-ci-check in levups/oss checks it.
  passed:
    name: CI passed
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [rubocop, test, docs, corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every job succeeded
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
        env:
          NEEDS: ${{ toJSON(needs) }}
